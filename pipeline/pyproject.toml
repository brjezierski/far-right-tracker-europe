[project]
name = "far-right-tracker-europe"
version = "0.1.0"
description = "Scrapes Wikipedia polling data on far-right and national-conservative parties in Europe"
readme = "README.md"
requires-python = ">=3.11.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "pycountry>=23.0.0",
    "dateparser>=1.2.0",
]

[project.scripts]
frt = "frt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frt"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
