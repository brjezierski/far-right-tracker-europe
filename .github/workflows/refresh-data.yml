name: Refresh data

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.11
      - name: Install deps
        run: uv sync
      - name: Run update
        run: uv run python -m data-pipeline.pipeline.update
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/countries/
          git commit -m "chore(data): daily refresh" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
  # deploy is called explicitly once the refreshed data is on main.
  deploy:
    needs: refresh
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-site.yml
