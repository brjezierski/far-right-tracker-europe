name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/**"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Always build main: when called after a data refresh, the triggering
      # sha predates the refresh commit.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build static site
        run: |
          cd frontend
          npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore(site): rebuild docs" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
