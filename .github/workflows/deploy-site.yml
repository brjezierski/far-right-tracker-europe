name: Build and deploy site

on:
  push:
    branches: [main]
    paths: ["frontend/**", "data/**", "pipeline/**", ".github/workflows/deploy-site.yml"]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build main: when called after a data refresh, the triggering
      # sha predates the refresh commit.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v4
      - name: Generate per-country JSON from CSV
        working-directory: pipeline
        run: |
          uv sync --no-dev
          uv run frt update --no-scraping
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
